<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Carcassonne Tile Counter</title>
  <link rel="shortcut icon" href="meeple.png">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root {
      color-scheme: light only;
    }

    /* (632 - 28 - 28) / 4 */
    #grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, 144px);
      color: #000000;
      padding-top: 20px;
      padding-right: 28px;
      padding-bottom: 20px;
      padding-left: 28px;
      grid-row-gap: 20px;
    }

    #grid-container > figure {
      text-align: center;
      margin: 0;
    }

    #grid-container > figure > img {
        width: 110px;
        aspect-ratio: 1;
        object-fit: contain;
    }

    body {
      margin: 0;
      container-type: inline-size;
    }

    html {
      background-color: #38AFCD;
    }

    #header {
      position: sticky;
      top: 0;
      z-index: 1000;
      padding-top: 20px;
      padding-right: 28px;
      padding-bottom: 20px;
      padding-left: 28px;
      background-color: #FFFFFFDD;
      color: #000000;
    }

    p {
      display: inline;
    }

    .expansion {
      display: inline-block;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 0.25em;
    }

    @media (prefers-color-scheme: dark) {
      #header {
        background-color: #000000DD;
        color: #FFFFFF;
      }
    }

    @container (max-width: 632px) {
      #grid-container {
        grid-template-columns: repeat(4, 1fr);
      }

      #grid-container > figure {
        font-size: 2.5vw;
      }

      #grid-container > figure > img {
        width: calc(110 / 144 * 100%);
      }
    }
  </style>
</head>
<body>
<div id="header">
  <p>In pile: </p><b id="in-pile-count"></b>&nbsp;&nbsp;&nbsp;&nbsp;<p>Used: </p><b id="used-count"></b>
  <br/><br/>
  <label class="checkbox-label">
    <input type="checkbox" id="sort-used">
    <span>Move used to bottom</span>
  </label>&nbsp;&nbsp;&nbsp;&nbsp;<button id="reset">Reset</button>
  <br/><br/>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="base" disabled="disabled" checked="checked">
      <span>Base</span>
    </label>
  </div>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="river" checked="checked">
      <span>River</span>
    </label>
  </div>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="inns-and-cathedrals" checked="checked">
      <span>Inns &amp; Cathedrals</span>
    </label>
  </div>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="traders-and-builders" checked="checked">
      <span>Traders &amp; Builders</span>
    </label>
  </div>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="princess-and-dragon" checked="checked">
      <span>Princess &amp; Dragon</span>
    </label>
  </div>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="dragon-and-fairy" checked="checked">
      <span>Dragon &amp; Fairy</span>
    </label>
  </div>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="flying-machines" checked="checked">
      <span>Flying Machines</span>
    </label>
  </div>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="messengers" checked="checked">
      <span>Messengers</span>
    </label>
  </div>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="ferries" checked="checked">
      <span>Ferries</span>
    </label>
  </div>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="goldmines" checked="checked">
      <span>Goldmines</span>
    </label>
  </div>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="mage-and-witch" checked="checked">
      <span>Mage &amp; Witch</span>
    </label>
  </div>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="robbers" checked="checked">
      <span>Robbers</span>
    </label>
  </div>
  <div class="expansion">
    <label class="checkbox-label">
      <input type="checkbox" id="crop-circles" checked="checked">
      <span>Crop Circles</span>
    </label>
  </div>
</div>
<div id="grid-container"></div>
<script src="CarcassonneTileCounter.js"></script>
</body>
</html>
